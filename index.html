<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#d32f2f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>MarketX</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#1f1a17;--mute:#7a6f66;--line:#f0e2cc;--pri:#d32f2f;--pri2:#ffb703;--yel:#ffd23f;--ok:#1e7d4f;--bad:#b3261e;--warn:#9a6700}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:52px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:0;color:#fff;font-size:22px;padding:4px 8px;cursor:pointer}
main{padding:12px;max-width:720px;margin:0 auto;padding-bottom:90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 12px;text-align:center;cursor:pointer;font-weight:600;font-size:18px}
.tile .ic{font-size:34px;display:block;margin-bottom:6px}
.tile .muted{font-weight:400}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--pri2);border-color:transparent}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;padding:11px 14px;border-radius:9px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer;width:100%}
.btn.sec{background:#fff;color:var(--pri)}
.btn.sm{width:auto;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.it .main{flex:1;min-width:0}
.it .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:13px;color:var(--mute)}
.it .r{text-align:right;font-weight:600;white-space:nowrap}
.muted{color:var(--mute);font-size:14px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#e8edf3;color:var(--mute)}
.pill.base{background:#dff3e8;color:var(--ok)}
.scanbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;z-index:6}
.scanbar .row{max-width:720px;margin:0 auto}
.scanbar input{font-size:18px}
.cam{flex:0 0 52px!important;height:46px;border-radius:9px;border:1px solid var(--pri);background:var(--pri);color:#fff;font-size:22px;cursor:pointer}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;max-width:90%;display:none;font-size:15px}
#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:720px;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 8px}
#camwrap{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
#camwrap video{flex:1;width:100%;object-fit:cover}
#camwrap .frame{position:absolute;left:10%;right:10%;top:35%;height:22%;border:3px solid #ffd23f;border-radius:12px;pointer-events:none}
#camwrap button{margin:12px}
.big{font-size:22px;font-weight:700}
.price{font-size:30px;font-weight:800;color:var(--pri);margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:15px}
.kv b{font-weight:600}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite}
.spin.dk{border-color:var(--pri);border-right-color:transparent}
@keyframes s{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mute);padding:24px 8px}
header{border-bottom:4px solid var(--yel)}
.banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#d62828,#e85d04);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.banner img{width:58px;height:58px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.banner b{font-size:22px;display:block}.banner span{font-size:13px;opacity:.9}
.tile .ic{background:#fff4d1;border-radius:14px;width:58px;height:58px;line-height:58px;margin:0 auto 8px}
.tile{border-left:5px solid var(--pri)}
.tile.y{border-left-color:var(--yel)}
.sbox{position:sticky;top:56px;z-index:4;background:var(--bg);padding:2px 0 8px}
.sbox input{font-size:19px;padding:12px;border:2px solid var(--yel)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pt{background:#fff;border:1px solid var(--line);border-top:4px solid var(--yel);border-radius:12px;padding:10px;cursor:pointer;min-height:92px}
.pt:active{transform:scale(.98)}
.pt .c{font-size:30px;font-weight:800;color:var(--pri);line-height:1.1;font-variant-numeric:tabular-nums}
.pt .n{font-weight:600;font-size:15px;margin-top:4px;word-break:break-word}
.pt .g{font-size:12px;color:var(--mute)}
.sec{font-weight:700;margin:10px 2px 6px;color:var(--ink)}
.pt{display:flex;flex-direction:column}
.ph{width:100%;aspect-ratio:1/1;max-height:120px;border-radius:9px;background:#fff8e1;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:6px}
.ph img{width:100%;height:100%;object-fit:contain}
.ph .ini{font-size:34px;font-weight:800;color:#e9b949}
.ph.none{aspect-ratio:auto;height:44px;justify-content:flex-start;padding-left:10px}
.ph.none .ini{font-size:24px}
.thumb{flex:0 0 44px;width:44px;height:44px;border-radius:8px;background:#fff8e1;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;color:#e9b949}
.thumb img{width:100%;height:100%;object-fit:contain}
.bigimg{display:block;margin:0 auto 6px;width:180px;height:180px;object-fit:contain;border-radius:12px;background:#fff8e1}
.bar{height:8px;background:#f3e6cf;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#f4a300);border-radius:6px}
.tk.okd{opacity:.65}
.rph{display:block;margin-top:6px;max-width:160px;max-height:160px;border-radius:8px;background:#f3e6cf;cursor:zoom-in;min-width:60px;min-height:60px}
.bonus{flex:0 0 auto;background:#fff4d1;color:#8a5a00;border:1px solid #f1d58a;border-radius:10px;padding:4px 8px;font-weight:700;font-size:14px;margin-left:6px}
details.emp{border-top:1px solid var(--line);padding:8px 0}
details.emp summary{cursor:pointer;list-style:none}
details.emp summary::-webkit-details-marker{display:none}
#ttabs,#atabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:visible}
#ttabs .chip,#atabs .chip{text-align:center;white-space:normal;padding:8px 4px;line-height:1.25;border-radius:12px}
#ttabs .chip b{display:block;font-size:13px}
.tbadge{display:inline-block;background:var(--pri);color:#fff;border-radius:12px;padding:1px 8px;font-size:13px;margin-left:6px;vertical-align:middle}
.bigcode{font-size:84px;font-weight:900;color:var(--pri);text-align:center;line-height:1;margin:10px 0;font-variant-numeric:tabular-nums;letter-spacing:2px}
.hint{font-size:13px;color:var(--mute);background:#fff8e6;border:1px solid #f1dca6;border-radius:9px;padding:8px 10px;margin:8px 0}
</style>
</head>
<body>
<header><button id="back" aria-label="Orqaga" style="visibility:hidden">←</button><h1 id="title">MarketX</h1><button id="gear" aria-label="Sozlamalar">⚙</button></header>
<main id="view"></main>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   MarketX — REGOS uchun xodimlar ilovasi
   Bo'limlar: Mahsulot ma'lumoti (tannarxsiz), Shtrix kod qo'shish, Tarozi kodlari.
   REGOS kaliti telefonda saqlanmaydi: so'rovlar himoyalangan shlyuz (worker.js) orqali o'tadi,
   shlyuz esa tannarx maydonlarini javobdan olib tashlaydi.
   ========================================================= */

// ---------- Sozlamalar ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem('mtsd_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mtsd_' + k, JSON.stringify(v)); } catch (e) {} }
};
let CFG = LS.get('cfg', { server: '', key: '' });
const serverUrl = () => (CFG.server || '').trim().replace(/\/+$/, '').replace(/\/v1$/i, '');

// ---------- API ----------
class ApiError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
async function api(method, body) {
  const s = serverUrl();
  if (!s) throw new ApiError('Avval sozlamalarda server manzilini kiriting');
  let res;
  const usedKey = CFG.key;
  try {
    const headers = { 'Content-Type': 'application/json;charset=utf-8' };
    if (CFG.key) headers['X-Access-Key'] = CFG.key;
    res = await fetch(s + '/v1/' + method, { method: 'POST', headers, body: JSON.stringify(body === undefined ? {} : body) });
  } catch (e) {
    throw new ApiError('Server bilan ulanib bo\'lmadi. Internetni va server manzilini tekshiring.');
  }
  if (res.status === 403) throw new ApiError('Server bu ilovaga ruxsat bermadi (ALLOWED_ORIGIN sozlamasini tekshiring)');
  let j;
  try { j = await res.json(); } catch (e) { throw new ApiError('Server javobini o\'qib bo\'lmadi (HTTP ' + res.status + ')'); }
  if (!j.ok) {
    const r = j.result || {};
    // Kod yopilgan yoki o'chirilgan: telefondagi barcha ma'lumotlarni o'chiramiz
    if (r.error === 401 && usedKey && usedKey === LS.get('cfg', {}).key) lockOut(r.description);
    throw new ApiError((r.description || 'REGOS xatosi') + (r.error && ![401, 403, 404, 400].includes(r.error) ? ' [' + r.error + ']' : ''), r.error);
  }
  if (j.me) LS.set('me', j.me);
  return j;
}
// Server orqali administrator amallari
let ADMIN = LS.get('admin', '');
async function adminApi(action, body) {
  const s = serverUrl();
  if (!s) throw new ApiError('Avval server manzilini kiriting');
  let res;
  try { res = await fetch(s + '/admin/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json;charset=utf-8', 'X-Admin-Key': ADMIN }, body: JSON.stringify(body || {}) }); }
  catch (e) { throw new ApiError('Server bilan ulanib bo\'lmadi'); }
  let j; try { j = await res.json(); } catch (e) { throw new ApiError('Server javobini o\'qib bo\'lmadi (HTTP ' + res.status + ')'); }
  if (!j.ok) { const r = j.result || {}; throw new ApiError(r.description || 'Xato', r.error); }
  return j.result;
}
let lockedOut = false;
function lockOut(msg) {
  if (lockedOut) return; lockedOut = true;
  try { CAT.reset(); } catch (e) {}
  try { clearRefs(); } catch (e) {}
  ['lookup', 'scale_use', 'bctype', 'me'].forEach(k => { try { localStorage.removeItem('mtsd_' + k); } catch (e) {} });
  CFG = { server: CFG.server, key: '' }; LS.set('cfg', CFG);
  setTimeout(() => {
    document.querySelectorAll('.modal,#camwrap').forEach(m => m.remove());
    stack.length = 0; current = null; setScan(null); setTitle('MarketX');
    $('#back').style.visibility = 'hidden';
    $('#view').innerHTML = '<div class="card" style="text-align:center;padding:28px 16px"><div style="font-size:52px">🔒</div><div class="big" style="margin:8px 0">' + esc(msg || 'Kirish yopilgan') + '</div>' +
      '<p class="muted">Bu telefondagi do\'kon ma\'lumotlari o\'chirildi. Ishlash uchun administratordan yangi kod oling.</p><button class="btn" id="tos">Sozlamalar</button></div>';
    $('#tos').onclick = () => { lockedOut = false; go(screenSettings, false); };
  }, 0);
}
const F = (field, value, op) => ({ Field: field, Operator: op || 'Equal', Value: String(value) });

// ---------- Yordamchilar ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Mahsulot rasmi: REGOS CDN havolasi (bo'lmasa — bosh harf)
const imgOf = x => (x && (x.img || x.image_url || (x.item && x.item.image_url))) || '';
const initial = n => esc(String(n || '?').trim().charAt(0).toUpperCase());
function imgErr(el) { const p = el.parentNode; if (p) p.classList.add('none'); if (p) p.innerHTML = '<span class="ini">' + esc(el.dataset.i || '') + '</span>'; }
const photo = (x, cls) => { const u = imgOf(x), n = x.item ? x.item.name : '';
  return '<div class="' + (cls || 'ph') + (u ? '' : ' none') + '">' + (u ? '<img loading="lazy" decoding="async" alt="" src="' + esc(u) + '" data-i="' + initial(n) + '" onerror="imgErr(this)">' : '<span class="ini">' + initial(n) + '</span>') + '</div>'; };
const fmt = (v, d) => (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('ru-RU', { maximumFractionDigits: d == null ? 3 : d });
let toastT;
function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = kind || ''; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', kind === 'bad' ? 5000 : 2200);
}
function beep(ok) {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(); const g = a.createGain();
    o.frequency.value = ok ? 1200 : 300; o.connect(g); g.connect(a.destination); g.gain.value = .12; o.start(); setTimeout(() => { o.stop(); a.close(); }, ok ? 90 : 300);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 40 : [80, 60, 80]);
}
async function busy(btn, fn) {
  const old = btn ? btn.innerHTML : null;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try { return await fn(); }
  catch (e) { toast(e.message, 'bad'); beep(false); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}
function sheet(html) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="sheet">' + html + '</div>';
  m.addEventListener('click', e => { if (e.target === m) m.remove(); });
  document.body.appendChild(m);
  return m;
}
function confirmBox(text, okText) {
  return new Promise(res => {
    const m = sheet('<h3>Tasdiqlang</h3><p>' + text + '</p><div class="row"><button class="btn sec" data-a="0">Bekor qilish</button><button class="btn" data-a="1">' + esc(okText || 'Ha') + '</button></div>');
    m.querySelectorAll('button').forEach(b => b.onclick = () => { m.remove(); res(b.dataset.a === '1'); });
  });
}
const opts = (arr, sel) => arr.map(x => '<option value="' + x.id + '"' + (String(x.id) === String(sel) ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('');

// ---------- Ma'lumotnomalar (kesh) ----------
const REF = {};
async function ref(name) {
  if (REF[name]) return REF[name];
  const map = { stock: 'stock/get', pricetype: 'pricetype/get', barcodetype: 'barcodetype/get' };
  const body = name === 'barcodetype' ? {} : { limit: 500, filters: name === 'stock' ? [F('deleted_mark', false)] : [] };
  const fetchIt = async () => {
    const j = await api(map[name], body);
    const list = (j.result || []).filter(x => !x.deleted_mark && !x.deleted);
    REF[name] = list; LS.set('ref_' + name, list); return list;
  };
  const saved = LS.get('ref_' + name, null);
  if (saved && saved.length) { REF[name] = saved; fetchIt().catch(() => {}); return saved; }
  return fetchIt();
}
function clearRefs() { for (const k in REF) delete REF[k]; ['stock', 'pricetype', 'barcodetype'].forEach(n => { try { localStorage.removeItem('mtsd_ref_' + n); } catch (e) {} }); }

// ---------- IndexedDB (katalogni telefonda saqlash) ----------
const IDB = {
  db: null,
  open() {
    if (this.db) return this.db;
    return this.db = new Promise((res, rej) => {
      const r = indexedDB.open('mahsulot-tsd', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async get(k) { try { const d = await this.open(); return await new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch (e) { return undefined; } },
  async set(k, v) { try { const d = await this.open(); d.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} },
  async clear() { try { const d = await this.open(); d.transaction('kv', 'readwrite').objectStore('kv').clear(); } catch (e) {} }
};
async function fetchAll(method, body, size, onProgress) {
  const out = []; let off = 0; const seen = new Set();
  for (let p = 0; p < 300; p++) {
    const j = await api(method, Object.assign({}, body, { limit: size, offset: off }));
    const r = j.result || [];
    const first = r.length ? String(r[0].id != null ? r[0].id : (r[0].item && r[0].item.id)) : '';
    if (first && seen.has(first)) break;
    seen.add(first);
    out.push(...r); if (onProgress) onProgress(out.length);
    if (r.length < size) break;
    off = j.next_offset || off + r.length;
  }
  return out;
}

// ---------- Mahalliy katalog ----------
// Tannarx katalogga umuman yozilmaydi (shlyuz uni yubormaydi, bu yerda ham saqlanmaydi).
const CAT = {
  store: {},
  key: (s, p) => (s || 0) + '_' + (p || 0),
  slim: x => ({
    item: { id: x.item.id, name: x.item.name, code: x.item.code, articul: x.item.articul, unit: x.item.unit ? { name: x.item.unit.name || x.item.unit.short_name || x.item.unit.full_name || x.item.unit.code || '' } : null, group: x.item.group ? { name: x.item.group.name } : null },
    quantity: x.quantity ? { common: x.quantity.common, booked: x.quantity.booked, allowed: x.quantity.allowed } : null,
    price: x.price, pricetype: x.pricetype ? { name: x.pricetype.name } : null,
    img: x.image_url || (x.item && x.item.image_url) || ''
  }),
  build(c, items, codes) {
    c.list = items; c.items = new Map(items.map(x => [x.item.id, x]));
    c.byCode = new Map(codes.map(b => [String(b[0]), b[1]]));
    c.byItemCode = new Map(items.map(x => [String(x.item.code), x.item.id]));
    c.lower = items.map(x => ((x.item.name || '') + ' ' + (x.item.articul || '')).toLowerCase());
  },
  peek(s, p) { const c = this.ensure(s, p); return c.ready ? c : null; },
  ensure(s, p, onProgress) {
    const k = this.key(s, p);
    let c = this.store[k];
    if (!c) {
      c = this.store[k] = { ready: false, ts: 0 };
      c.restoring = IDB.get('cat3_' + k).then(saved => {
        if (saved && !c.ready) { this.build(c, saved.items, saved.codes); c.ts = saved.ts; c.ready = true; }
      });
    }
    c.restoring.then(() => {
      if (c.loading || (c.ts && Date.now() - c.ts < 5 * 60e3)) return;
      c.loading = this.refresh(c, k, s, p, onProgress).catch(() => {}).finally(() => { c.loading = null; });
    });
    return c;
  },
  async refresh(c, k, s, p, onProgress) {
    const f = [F('deleted_mark', false)];
    if (s) f.push(F('stock_id', s)); if (p) f.push(F('price_type_id', p));
    // Mahsulotlar kelishi bilan xabar beramiz (tarozi kodlari shtrix kodlarni kutmaydi)
    const itemsP = fetchAll('item/getext', { filters: f, image_size: 'Small' }, 1000, n => onProgress && onProgress(n)).then(items => {
      const slim = items.map(this.slim);
      c.partial = slim;
      window.dispatchEvent(new CustomEvent('catalog-items', { detail: { k, list: slim } }));
      return slim;
    });
    // Shtrix kodlar yuklanmasa ham katalog ishlayveradi (bir daqiqadan keyin qayta uriniladi)
    let bcOk = true;
    const bcsP = fetchAll('barcode/get', {}, 1000).catch(() => { bcOk = false; return []; });
    const [slim, bcs] = await Promise.all([itemsP, bcsP]);
    const codes = bcs.map(b => [b.value, b.item_id]);
    this.build(c, slim, codes); c.ts = bcOk ? Date.now() : Date.now() - 4 * 60e3; c.ready = true;
    IDB.set('cat3_' + k, { items: slim, codes, ts: c.ts });
    window.dispatchEvent(new CustomEvent('catalog', { detail: k }));
  },
  find(c, term) {
    const id = c.byCode.get(term) || c.byItemCode.get(term);
    if (id && c.items.get(id)) return { exact: c.items.get(id) };
    const t = term.toLowerCase(), res = [];
    for (let i = 0; i < c.list.length && res.length < 30; i++) if (c.lower[i].includes(t)) res.push(c.list[i]);
    return { list: res };
  },
  owner(code) {
    for (const k in this.store) { const c = this.store[k]; if (c.ready && c.byCode.has(code)) return { id: c.byCode.get(code), x: c.items.get(c.byCode.get(code)) }; }
    return null;
  },
  anyReady() { for (const k in this.store) if (this.store[k].ready) return true; return false; },
  addCode(code, itemId) { for (const k in this.store) { const c = this.store[k]; if (c.ready) c.byCode.set(String(code), itemId); } },
  reset() { this.store = {}; IDB.clear(); }
};

const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'code_93', 'itf', 'codabar', 'qr_code', 'data_matrix'];
function cameraScan() {
  return new Promise(async resolve => {
    const w = document.createElement('div'); w.id = 'camwrap';
    w.innerHTML = '<video playsinline muted autoplay></video><div class="frame"></div><button class="btn sec">Yopish</button>';
    document.body.appendChild(w);
    const video = w.querySelector('video'); let stream = null, stopped = false, zx = null;
    const finish = v => { if (stopped) return; stopped = true; try { zx && zx.stop(); } catch (e) {} if (stream) stream.getTracks().forEach(t => t.stop()); w.remove(); if (v) beep(true); resolve(v || null); };
    w.querySelector('button').onclick = () => finish(null);
    try {
      if ('BarcodeDetector' in window) {
        let fm = FORMATS; try { const sup = await BarcodeDetector.getSupportedFormats(); fm = FORMATS.filter(f => sup.includes(f)); } catch (e) {}
        const det = new BarcodeDetector({ formats: fm });
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
        video.srcObject = stream; await video.play();
        const loop = async () => {
          if (stopped) return;
          try { const r = await det.detect(video); if (r && r.length) return finish(r[0].rawValue); } catch (e) {}
          setTimeout(loop, 150);
        };
        loop();
      } else {
        const mod = await import('https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm');
        const reader = new mod.BrowserMultiFormatReader();
        zx = await reader.decodeFromConstraints({ video: { facingMode: 'environment' } }, video, (res) => { if (res) finish(res.getText()); });
      }
    } catch (e) {
      finish(null);
      toast('Kamerani ochib bo\'lmadi: ' + (e.message || e) + '. Brauzerga kamera ruxsatini bering.', 'bad');
    }
  });
}

// ---------- Markirovka (Asl belgisi, DataMatrix) ----------
// GS1 ko'rinishi: 01 + GTIN(14) + 21 + seriya ... ; tamaki qutisi: GTIN(14) + seriya (25–30 belgi).
// Natija: mahsulot shtrix kodi (EAN-13 va boshqa variantlar).
function parseMark(raw) {
  let s = String(raw || '').trim().replace(/^\][a-zA-Z]\d/, '');      // skaner prefiksi: ]d2, ]C1, ]Q3
  s = s.replace(/^[\x1d␝~]+/, '');
  let g = null;
  const par = s.match(/^\(01\)\s*(\d{14})/);                          // (01)04780000000017(21)...
  if (par) g = par[1];
  else if (/^01\d{14}/.test(s) && s.length >= 18) g = s.slice(2, 16);  // 0104780000000017 21....
  else if (/^\d{14}/.test(s) && s.length >= 21 && s.length <= 40 && /\D/.test(s.slice(14))) g = s.slice(0, 14); // tamaki
  if (!g) return null;
  const cands = [];
  for (const v of [g, g.replace(/^0/, ''), g.replace(/^0+/, '')]) if (v.length >= 8 && !cands.includes(v)) cands.push(v);
  const ean = g.length === 14 && g[0] === '0' ? g.slice(1) : g;       // biriktirish uchun asosiy ko'rinish
  return { gtin: g, ean, cands };
}
const isMark = t => !!parseMark(t);
// Markirovka bo'yicha mahsulotni topish: avval telefondagi katalog, keyin REGOS
async function itemByMark(mk, stockId, priceTypeId) {
  const want = CAT.peek(stockId, priceTypeId);
  for (const k in CAT.store) {
    const c = CAT.store[k]; if (!c.ready) continue;
    for (const v of mk.cands) {
      const id = c.byCode.get(v); if (!id) continue;
      const x = (want && want.items.get(id)) || c.items.get(id);  // tanlangan ombor/narx turidagi ma'lumot afzal
      if (x) return { item: x, code: v };
    }
  }
  for (const v of mk.cands) {
    const bid = await itemByBarcode(v);
    if (bid) {
      const f = [F('id', bid)]; if (stockId) f.push(F('stock_id', stockId)); if (priceTypeId) f.push(F('price_type_id', priceTypeId));
      const r = await api('item/getext', { filters: f, limit: 1, image_size: 'Small' });
      if (r.result && r.result[0]) return { item: r.result[0], code: v };
    }
  }
  return null;
}

async function resolveItem(term, stockId, priceTypeId) {
  const c0 = CAT.peek(stockId, priceTypeId);
  const mk = c0 && c0.byCode.has(term) ? null : parseMark(term); // mavjud oddiy shtrix kod — markirovka emas
  if (mk) {
    const hit = await itemByMark(mk, stockId, priceTypeId);
    return hit ? { item: hit.item, mark: mk } : { item: null, notFound: true, mark: mk };
  }
  const c = CAT.peek(stockId, priceTypeId);
  if (c) {
    const r = CAT.find(c, term);
    if (r.exact) return { item: r.exact };
    if (r.list.length === 1) return { item: r.list[0] };
    if (r.list.length > 1) return { item: await pickItem(r.list, '«' + term + '» bo\'yicha ' + r.list.length + ' ta natija') };
  }
  const list = await findItems(term, stockId, priceTypeId);
  if (!list.length) {
    // Shtrix kod bo'lishi mumkin — to'g'ridan-to'g'ri tekshiramiz
    const bid = /^\S{4,}$/.test(term) ? await itemByBarcode(term) : null;
    if (bid) {
      const f = [F('id', bid)]; if (stockId) f.push(F('stock_id', stockId)); if (priceTypeId) f.push(F('price_type_id', priceTypeId));
      const r = await api('item/getext', { filters: f, limit: 1 });
      if (r.result && r.result[0]) return { item: r.result[0] };
    }
    return { item: null, notFound: true };
  }
  if (list.length === 1) return { item: list[0] };
  if (/^\S{6,}$/.test(term)) {
    const bid = await itemByBarcode(term);
    const hit = bid && list.find(x => x.item.id === bid);
    if (hit) return { item: hit };
  }
  return { item: await pickItem(list, '«' + term + '» bo\'yicha ' + list.length + ' ta natija') };
}
const looksLikeCode = t => /^\d{6,14}$/.test(t) || /^\S{8,}$/.test(t);

// ---------- Tarozi kodlari ----------
// Birligi «kg» bo'lgan mahsulotlar. REGOS'dagi mahsulot kodi = tarozidagi PLU.
// Qidiruv lotin va kirill harflarida ishlaydi: «помидор» → «pomidor».
// Standart: nomida kg / кг / kilo / кило bo'lgan birliklar. Mos kelmasa, foydalanuvchi o'zi tanlaydi (telefonda eslab qolinadi).
const KG_RE = /(^|[^a-zа-я])(kg|кг)([^a-zа-я]|$)|kilo|кило/i;
const unitOf = x => ((x.item.unit && x.item.unit.name) || '').trim();
const IS_KG = u => { const sel = LS.get('kg_units', null); return sel && sel.length ? sel.includes((u || '').trim()) : KG_RE.test(u || ''); };
const CYR = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'j','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'x','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':'','ы':'i','ь':'','э':'e','ю':'yu','я':'ya','ў':'o','қ':'q','ғ':'g','ҳ':'h' };
// Ikki tomonni ham bir xil ko'rinishga keltiramiz: x/h, q/k, o'/o, g'/g farqlari e'tiborga olinmaydi
function norm(s) {
  s = String(s || '').toLowerCase().replace(/[а-яёўқғҳ]/g, c => CYR[c] != null ? CYR[c] : c);
  return s.replace(/[ʻʼ'`’‘]/g, '').replace(/sh/g, '§').replace(/ch/g, '¢').replace(/h/g, 'x').replace(/q/g, 'k').replace(/w/g, 'v').replace(/\s+/g, ' ').trim();
}
async function screenScale() {

      '<div class="muted" style="text-align:center">Tarozi kodi</div><div class="bigcode">' + esc(i.code) + '</div>' +
      '<div class="big" style="text-align:center">' + esc(i.x.item.name) + '</div>' +
      '<div class="muted" style="text-align:center;margin-top:4px">' + esc(i.g) + (i.x.price != null ? ' · ' + fmt(i.x.price, 2) + ' so\'m / kg' : '') + '</div>' +
      '<button class="btn" style="margin-top:16px">Yopish</button>');
    m.querySelector('.btn').onclick = () => { m.remove(); const s = $('#sq'); if (s) { s.select(); } };
    if (u) api('item/getext', { filters: [F('id', id)], limit: 1, image_size: 'Medium' }).then(r => {
      const big = r.result && r.result[0] && imgOf(r.result[0]); const el = m.querySelector('#bimg');
      if (big && el && big !== u) { const im = new Image(); im.onload = () => { el.src = big; }; im.src = big; }
    }).catch(() => {});
  };

  let t;
  $('#sq').addEventListener('input', e => { query = e.target.value; clearTimeout(t); t = setTimeout(draw, 60); });
  $('#sq').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); query = e.target.value; draw(); if (shown.length === 1 || (shown.length && /^\d+$/.test(query.trim()) && shown[0].code === query.trim())) open(shown[0].x.item.id); } });

  // Telefonda saqlangan katalog darhol ko'rsatiladi; yangilansa ro'yxat o'zi yangilanadi
  const c = CAT.ensure(0, 0, n => { const l = $('#sload'); if (l) l.textContent = 'Katalog yuklanmoqda: ' + n + ' ta…'; });
  const onCat = e => { if (e.detail !== CAT.key(0, 0)) return; if (!$('#sq')) return window.removeEventListener('catalog', onCat); build(CAT.store[e.detail]); };
  window.addEventListener('catalog', onCat);
  const onItems = e => { if (!$('#sq')) return window.removeEventListener('catalog-items', onItems); if (e.detail.k === CAT.key(0, 0) && !lastCat) build({ list: e.detail.list }); };
  window.addEventListener('catalog-items', onItems);
  await c.restoring;
  if (c.ready && $('#sq')) return build(c);
  if (c.partial && !lastCat) build({ list: c.partial });
  if (c.loading) await c.loading;
  if (!c.ready && !lastCat) { const l = $('#sload'); if (l) l.textContent = 'Katalogni yuklab bo\'lmadi. Internetni tekshiring va qayta oching.'; }
}

// ---------- Shtrix kod qo'shish ----------
// O'chirish imkoniyati ataylab yo'q: xodim faqat qo'shadi.
function screenBarcodes(preItem) {
  return async function () {
    setTitle('Shtrix kod qo\'shish');
    let selected = preItem || null, types = [], codes = [];
    try { types = await ref('barcodetype'); } catch (e) { toast(e.message, 'bad'); }
    CAT.ensure(0, 0);
    const defType = () => { const ean = types.find(t => /ean.?13/i.test(t.name)); return LS.get('bctype', (ean || types[0] || {}).id); };

    const render = async () => {
      if (!selected) {
        $('#view').innerHTML = '<div class="card"><b>1. Mahsulotni tanlang</b><p class="muted">Pastdagi maydonga mahsulot nomini, kodini yoki mavjud shtrix kodini yozing yoki skanerlang.</p>' +
          '<p class="muted">Hali hech qaysi mahsulotga biriktirilmagan yangi kodni skanerlasangiz, uni qaysi mahsulotga biriktirishni so\'raymiz.</p></div>';
        setScan(onSearch, 'Mahsulot nomi yoki shtrix kod…');
        return;
      }
      const it = selected.item;
      $('#view').innerHTML = '<div class="card"><div class="row">' + photo(selected, 'thumb') + '<div style="flex:1;min-width:0"><div class="big">' + esc(it.name) + '</div><div class="muted">Kod: ' + esc(it.code) + (it.articul ? ' · Art: ' + esc(it.articul) : '') + '</div></div><button class="btn sec sm" id="chg" style="flex:0 0 auto">Boshqa</button></div></div>' +
        '<div class="card"><b>Mavjud shtrix kodlar</b><div class="list" id="bcl"><div class="empty">Yuklanmoqda…</div></div></div>' +
        '<div class="card"><b>2. Yangi shtrix kod</b>' +
        '<label>Shtrix kod turi</label><select id="bt">' + opts(types, defType()) + '</select>' +
        '<label>Shtrix kod qiymati</label><div class="row"><input id="bv" inputmode="numeric" autocomplete="off"><button class="cam" id="bcam" aria-label="Kamera">📷</button></div>' +
        '<div id="bvinfo" class="muted" style="min-height:18px;margin-top:4px"></div>' +
        '<div class="row" style="margin-top:8px"><button class="btn sec" id="gen">EAN-13 yaratish</button><button class="btn" id="add">Qo\'shish</button></div></div>';
      $('#chg').onclick = () => { selected = null; render(); };
      $('#bt').onchange = () => LS.set('bctype', $('#bt').value);
      const fromMark = v => { const mk = parseMark(v); if (mk) { $('#bv').value = mk.ean; toast('📦 Markirovkadan shtrix kod olindi: ' + mk.ean, 'ok'); return mk.ean; } return v; };
      $('#bv').addEventListener('input', () => checkValue($('#bv').value));
      $('#bv').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (isMark($('#bv').value)) { checkValue(fromMark($('#bv').value)); return; } $('#add').click(); } });
      $('#bcam').onclick = async () => { const v = await cameraScan(); if (v) { $('#bv').value = v; checkValue(fromMark(v)); } };
      $('#gen').onclick = e => busy(e.currentTarget, async () => {
        const j = await api('barcode/generateean13', {});
        $('#bv').value = String(j.result.value);
        const ean = types.find(t => /ean.?13/i.test(t.name)); if (ean) $('#bt').value = ean.id;
        checkValue($('#bv').value);
      });
      $('#add').onclick = e => busy(e.currentTarget, async () => {
        const v = $('#bv').value.trim();
        if (!v) throw new Error('Shtrix kod qiymatini kiriting');
        if (v.length > 128) throw new Error('Shtrix kod 128 belgidan oshmasligi kerak');
        if (!$('#bt').value) throw new Error('Shtrix kod turini tanlang');
        const lo = CAT.owner(v);
        const ownerId = lo ? lo.id : await itemByBarcode(v);
        if (ownerId && ownerId !== it.id) throw new Error('Bu shtrix kod boshqa mahsulotga biriktirilgan');
        if (ownerId === it.id) throw new Error('Bu shtrix kod shu mahsulotda allaqachon bor');
        const j = await api('barcode/add', { item_id: it.id, barcode_type_id: +$('#bt').value, value: v, forced: false, _item_name: it.name });
        CAT.addCode(v, it.id);
        const bt = types.find(t => String(t.id) === $('#bt').value);
        if (j.result && j.result.new_id) { codes.push({ id: j.result.new_id, item_id: it.id, value: v, barcode_type: bt }); drawCodes(); } else await loadCodes();
        beep(true); toast('Shtrix kod qo\'shildi', 'ok'); $('#bv').value = ''; $('#bvinfo').textContent = ''; $('#bv').focus();
      });
      // Pastki panel — boshqa mahsulotga o'tish; yangi kod o'rtadagi maydonga kiritiladi
      setScan(onSearch, 'Boshqa mahsulot: shtrix kod yoki nomi…');
      setTimeout(() => { if (!document.querySelector('.modal') && $('#bv')) $('#bv').focus({ preventScroll: true }); }, 120);
      await loadCodes();
    };

    let chkT;
    const checkValue = v => {
      clearTimeout(chkT); const el = $('#bvinfo'); v = (v || '').trim();
      if (!v) { el.textContent = ''; return; }
      let msg = '';
      if (/^\d{13}$/.test(v)) msg = ean13ok(v) ? '✓ EAN-13 nazorat raqami to\'g\'ri' : '⚠️ EAN-13 nazorat raqami noto\'g\'ri';
      else if (/^\d{8}$/.test(v)) msg = ean8ok(v) ? '✓ EAN-8' : '⚠️ EAN-8 nazorat raqami noto\'g\'ri';
      el.textContent = msg;
      const lo = CAT.owner(v);
      if (lo && lo.id !== selected.item.id) { el.innerHTML = '❌ Bu kod «' + esc(lo.x ? lo.x.item.name : '#' + lo.id) + '» mahsulotiga biriktirilgan'; return; }
      if (lo) { el.textContent = 'ℹ️ Bu kod shu mahsulotda allaqachon bor'; return; }
      chkT = setTimeout(async () => {
        try {
          const owner = await itemByBarcode(v);
          if (!$('#bv') || $('#bv').value.trim() !== v) return;
          if (owner && owner !== selected.item.id) {
            const r = await api('item/getext', { filters: [F('id', owner)], limit: 1 });
            const nm = r.result && r.result[0] ? r.result[0].item.name : ('#' + owner);
            el.innerHTML = '❌ Bu kod «' + esc(nm) + '» mahsulotiga biriktirilgan';
          } else if (owner) el.textContent = 'ℹ️ Bu kod shu mahsulotda allaqachon bor';
          else el.textContent = (msg ? msg + ' · ' : '') + 'Bo\'sh kod, qo\'shish mumkin';
        } catch (e) {}
      }, 400);
    };

    const loadCodes = async () => {
      try { const j = await api('barcode/get', { filters: [F('item_id', selected.item.id)] }); codes = j.result || []; drawCodes(); }
      catch (e) { $('#bcl').innerHTML = '<div class="empty">❌ ' + esc(e.message) + '</div>'; }
    };
    const drawCodes = () => {
      $('#bcl').innerHTML = codes.length ? codes.map(b =>
        '<div class="it" style="cursor:default"><div class="main"><div class="t" style="font-family:ui-monospace,monospace">' + esc(b.value) + '</div><div class="s">' + esc((b.barcode_type && b.barcode_type.name) || '') + ' ' + (b.base ? '<span class="pill base">asosiy</span>' : '') + '</div></div></div>').join('')
        : '<div class="empty">Bu mahsulotda shtrix kod yo\'q</div>';
    };

    const onSearch = term => busy(null, async () => {
      const mk = parseMark(term);
      if (mk) {
        const hit = await itemByMark(mk);
        if (hit) { selected = hit.item; beep(true); return render(); }
        beep(false);
        const att = await attachFlow(mk.ean);
        if (att) { selected = att; render(); }
        return;
      }
      const c = CAT.peek(0, 0);
      if (c) {
        const r = CAT.find(c, term);
        if (r.exact) { selected = r.exact; beep(true); return render(); }
        if (r.list.length === 1) { selected = r.list[0]; return render(); }
        if (r.list.length > 1) { const p = await pickItem(r.list); if (p) { selected = p; render(); } return; }
      }
      const owner = /^\S{4,}$/.test(term) ? await itemByBarcode(term) : null;
      if (owner) {
        const r = await api('item/getext', { filters: [F('id', owner)], limit: 1 });
        if (r.result && r.result[0]) { selected = r.result[0]; beep(true); return render(); }
      }
      const list = /^\d{8,14}$/.test(term) ? [] : await findItems(term, null, null, 30);
      if (list.length === 1) { selected = list[0]; return render(); }
      if (list.length) { const p = await pickItem(list); if (p) { selected = p; render(); } return; }
      if (/^\S{6,}$/.test(term)) { const att = await attachFlow(term); if (att) { selected = att; render(); } }
      else { beep(false); toast('Topilmadi', 'bad'); }
    });

    await render();
  };
}

// Skanerlangan yangi kodni mahsulotga biriktirish
function attachFlow(code, stockId, ptId) {
  return new Promise(async res => {
    let types = [];
    try { types = await ref('barcodetype'); } catch (e) { toast(e.message, 'bad'); return res(null); }
    const ean = types.find(t => /ean.?13/i.test(t.name));
    const guess = /^\d{13}$/.test(code) && ean ? ean.id : LS.get('bctype', (ean || types[0] || {}).id);
    const m = sheet('<h3>Yangi shtrix kod</h3><div class="big" style="font-family:ui-monospace,monospace">' + esc(code) + '</div>' +
      '<p class="muted">Bu kod hech qaysi mahsulotga biriktirilmagan. Qaysi mahsulotga qo\'shamiz?</p>' +
      '<label>Shtrix kod turi</label><select id="at">' + opts(types, guess) + '</select>' +
      '<label>Mahsulotni qidiring</label><input id="aq" placeholder="Nomi, kodi yoki artikuli" autocomplete="off"><div class="list" id="al" style="margin-top:6px"></div>' +
      '<button class="btn sec" id="ax" style="margin-top:10px">Bekor qilish</button>');
    let t, list = [];
    const run = async () => {
      const q = m.querySelector('#aq').value.trim(); if (q.length < 2) { m.querySelector('#al').innerHTML = ''; return; }
      try {
        const c = CAT.peek(stockId, ptId) || CAT.peek(0, 0);
        const loc = c ? CAT.find(c, q) : null;
        const locList = loc ? (loc.exact ? [loc.exact] : loc.list) : [];
        list = locList.length ? locList : await findItems(q, stockId, ptId, 25);
        m.querySelector('#al').innerHTML = list.map((x, i) => '<div class="it" data-i="' + i + '"><div class="main"><div class="t">' + esc(x.item.name) + '</div><div class="s">Kod: ' + esc(x.item.code) + '</div></div></div>').join('') || '<div class="empty">Topilmadi</div>';
        m.querySelectorAll('#al .it').forEach(el => el.onclick = async () => {
          const x = list[+el.dataset.i];
          if (!await confirmBox('«' + esc(code) + '» shtrix kodini «' + esc(x.item.name) + '» mahsulotiga biriktirasizmi?', 'Biriktirish')) return;
          try {
            await api('barcode/add', { item_id: x.item.id, barcode_type_id: +m.querySelector('#at').value, value: code, forced: false, _item_name: x.item.name });
            LS.set('bctype', m.querySelector('#at').value);
            CAT.addCode(code, x.item.id);
            m.remove(); beep(true); toast('Shtrix kod biriktirildi', 'ok'); res(x);
          } catch (e) { toast(e.message, 'bad'); beep(false); }
        });
      } catch (e) { m.querySelector('#al').innerHTML = '<div class="empty">❌ ' + esc(e.message) + '</div>'; }
    };
    m.querySelector('#aq').oninput = () => { clearTimeout(t); t = setTimeout(run, CAT.anyReady() ? 120 : 350); };
    m.querySelector('#ax').onclick = () => { m.remove(); res(null); };
    m.querySelector('#aq').focus();
  });
}

async function postJson(path, body, admin) {
  const s = serverUrl();
  if (!s) throw new ApiError('Avval sozlamalarda server manzilini kiriting');
  const usedKey = CFG.key;
  const headers = { 'Content-Type': 'application/json;charset=utf-8' };
  if (admin) headers['X-Admin-Key'] = ADMIN; else if (CFG.key) headers['X-Access-Key'] = CFG.key;
  let res;
  try { res = await fetch(s + path, { method: 'POST', headers, body: JSON.stringify(body || {}) }); }
  catch (e) { throw new ApiError('Server bilan ulanib bo\'lmadi. Internetni tekshiring.'); }
  let j; try { j = await res.json(); } catch (e) { throw new ApiError('Server javobini o\'qib bo\'lmadi (HTTP ' + res.status + ')'); }
  if (!j.ok) {
    const r = j.result || {};
    if (!admin && r.error === 401 && usedKey && usedKey === LS.get('cfg', {}).key) lockOut(r.description);
    throw new ApiError(r.description || 'Xato', r.error);
  }
  return j.result;
}
const tapi = (a, b) => postJson('/tasks/' + a, b, false);
const tadm = (a, b) => postJson('/admin/t_' + a, b, true);

// Rasmlar: sarlavha bilan yuklab olinadi va blob sifatida ko'rsatiladi
const PHOTOS = new Map();
async function photoUrl(key, admin) {
  if (PHOTOS.has(key)) return PHOTOS.get(key);
  const s = serverUrl();
  const headers = { 'Content-Type': 'application/json' };
  if (admin) headers['X-Admin-Key'] = ADMIN; else headers['X-Access-Key'] = CFG.key;
  const p = fetch(s + (admin ? '/admin/t_photo' : '/tasks/photo'), { method: 'POST', headers, body: JSON.stringify({ key }) })
    .then(r => r.ok && /image/.test(r.headers.get('Content-Type') || '') ? r.blob() : null)
    .then(b => b ? URL.createObjectURL(b) : null).catch(() => null);
  PHOTOS.set(key, p); return p;
}
function loadPhotos(root, admin) {
  root.querySelectorAll('img[data-pk]').forEach(async im => {
    const u = await photoUrl(im.dataset.pk, admin);
    if (u) { im.src = u; im.onclick = () => { const m = sheet('<img src="' + u + '" style="width:100%;border-radius:10px"><button class="btn" style="margin-top:10px">Yopish</button>'); m.querySelector('.btn').onclick = () => m.remove(); }; }
    else im.replaceWith(Object.assign(document.createElement('span'), { className: 'muted', textContent: '🖼️ rasm o\'chirilgan' }));
  });
}
const phImg = k => k ? '<img class="rph" data-pk="' + esc(k) + '" alt="">' : '';

// Kameradan rasm olish va siqish (~150–300 KB)
function pickPhoto() {
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
    inp.style.display = 'none'; document.body.appendChild(inp);
    inp.onchange = () => { const f = inp.files && inp.files[0]; inp.remove(); res(f || null); };
    inp.click();
  });
}
function compress(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      let w = im.naturalWidth, h = im.naturalHeight; const k = Math.min(1, (max || 1280) / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(im, 0, 0, w, h); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q || 0.72));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Rasmni ochib bo\'lmadi')); };
    im.src = url;
  });
}
const tm = t => t ? new Date(t).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
const dshort = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) : '';
const ST = { done: ['⏳', 'Tekshiruvda', '#9a6700'], ok: ['✅', 'Qabul qilindi', 'var(--ok)'], ret: ['↩️', 'Qaytarildi', 'var(--bad)'] };
const stBadge = r => { const s = ST[r.st] || ST.done; return '<span class="pill" style="background:#fff;border:1px solid ' + s[2] + ';color:' + s[2] + '">' + s[0] + ' ' + s[1] + '</span>'; };
const MONTHS = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
const monName = m => m ? MONTHS[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4) : '';

// Hisobot oynasi: izoh, rasm (majburiy yoki ixtiyoriy), oylik uchun miqdor
function reportSheet(opt) {
  return new Promise(res => {
    let photo = null;
    const m = sheet('<h3>' + esc(opt.title) + '</h3>' + (opt.desc ? '<p class="muted" style="margin-top:0">' + esc(opt.desc) + '</p>' : '') +
      (opt.qty ? '<label>Miqdor' + (opt.unit ? ' (' + esc(opt.unit) + ')' : '') + '</label><input id="rq" type="number" inputmode="decimal" min="0" step="any" value="1">' : '') +
      '<label>Izoh ' + '<span class="muted">(ixtiyoriy)</span></label><input id="rn" maxlength="500" autocomplete="off" placeholder="Masalan: hammasi joyida">' +
      '<label>Rasm ' + (opt.photo ? '<b style="color:var(--bad)">— majburiy</b>' : '<span class="muted">(ixtiyoriy)</span>') + '</label>' +
      '<div id="rpv" style="margin:6px 0"></div><button class="btn sec" id="rph">📷 Rasmga olish</button>' +
      '<div class="row" style="margin-top:12px"><button class="btn sec" id="rx">Bekor qilish</button><button class="btn" id="rs">Yuborish</button></div>');
    m.querySelector('#rph').onclick = async () => {
      const f = await pickPhoto(); if (!f) return;
      try { photo = await compress(f); m.querySelector('#rpv').innerHTML = '<img src="' + photo + '" style="max-width:100%;max-height:220px;border-radius:10px">'; m.querySelector('#rph').textContent = '📷 Qayta olish'; }
      catch (e) { toast(e.message, 'bad'); }
    };
    m.querySelector('#rx').onclick = () => { m.remove(); res(null); };
    m.querySelector('#rs').onclick = () => {
      if (opt.photo && !photo) return toast('Rasm majburiy — 📷 tugmasini bosing', 'bad');
      const r = { note: m.querySelector('#rn').value.trim(), photo };
      if (opt.qty) { r.n = Number(m.querySelector('#rq').value); if (!(r.n > 0)) return toast('Miqdorni kiriting', 'bad'); }
      m.remove(); res(r);
    };
  });
}

  };
  const act = async b => {
    const kind = b.dataset.k, id = b.dataset.id;

    });

  await load();
}

        const as = assignees(x);
        const done = as.filter(e => { const r = ((data.reports[e.id] || {}).t || {})[x.id]; return r && r.st === 'ok'; }).length;
        return '<div class="card tk' + (x.closed ? ' okd' : '') + '"><div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><div style="font-weight:700">' + (x.closed ? '🔒 ' : '') + esc(x.title) + '</div>' + (x.desc ? '<div class="muted">' + esc(x.desc) + '</div>' : '') +
          '<div class="s muted">' + (x.due ? '📅 ' + dshort(x.due) + ' · ' : '') + (x.photo ? '📷 · ' : '') + esc(whoText(x)) + ' · ✅ ' + done + '/' + as.length + '</div></div>' +
          '<button class="btn sm sec" data-ed="task" data-id="' + x.id + '" style="flex:0 0 auto">✏️</button></div>' +
          '<div class="list">' + as.map(e => { const r = ((data.reports[e.id] || {}).t || {})[x.id]; return '<div class="it" style="cursor:default;align-items:flex-start"><div style="flex:0 0 24px">' + (r ? (ST[r.st] || ST.done)[0] : '⬜') + '</div><div class="main"><div class="t">' + esc(e.name) + '</div>' + (r ? repLine(r) + revBtns('t', e.id, x.id, '', r) : '<div class="s">hali bajarilmagan</div>') + '</div></div>'; }).join('') + '</div>' +
          '<button class="btn sm sec" data-close="' + x.id + '" data-c="' + (x.closed ? '0' : '1') + '" style="margin-top:6px">' + (x.closed ? '🔓 Qayta ochish' : '🔒 Yopish (xodimlardan yashirish)') + '</button></div>';
      }).join('') : '<div class="card empty">Topshiriq yo\'q</div>';
    } else {
      h += '<div class="card"><div class="row"><b style="flex:1">Oy</b><input type="month" id="mn" value="' + month + '" style="flex:0 0 auto;width:auto;padding:6px"></div>' +
        '<div class="row" style="margin-top:8px"><button class="btn" id="add">➕ Yangi maqsad</button><button class="btn sec" id="copy">📋 O\'tgan oydan nusxa</button></div></div>';
      h += data.goals.length ? data.goals.map(g => {
        const as = assignees(g);
        return '<div class="card tk"><div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:17px">' + esc(g.title) + '</div>' + (g.desc ? '<div class="muted">' + esc(g.desc) + '</div>' : '') +
          '<div class="s muted">Maqsad: ' + fmt(g.target) + ' ' + esc(g.unit || '') + (g.photo ? ' · 📷' : '') + ' · ' + esc(whoText(g)) + '</div></div>' + (g.bonus ? '<div class="bonus">🎁 ' + esc(g.bonus) + '</div>' : '') +
          '<button class="btn sm sec" data-ed="goal" data-id="' + g.id + '" style="flex:0 0 auto;margin-left:6px">✏️</button></div>' +
          as.map(e => {
            const r = ((data.reports[e.id] || {}).m || {})[g.id] || { e: [] };
            const sum = (r.e || []).filter(z => z.st !== 'ret').reduce((a, z) => a + (Number(z.n) || 0), 0), pct = Math.min(100, Math.round(sum / g.target * 100));
            return '<details class="emp"' + (pct >= 100 && !r.award ? ' open' : '') + '><summary><b>' + esc(e.name) + '</b> <span class="muted">' + fmt(sum) + ' / ' + fmt(g.target) + '</span> ' + (r.award ? '<span class="pill base">🎁 bonus berildi</span>' : pct >= 100 ? '<span class="pill" style="background:#fff4d1;color:#9a6700">🔥 bajarildi</span>' : '') +
              '<div class="bar"><i style="width:' + pct + '%"></i></div></summary>' +
              (r.e || []).slice().reverse().map(z => '<div class="it" style="cursor:default;align-items:flex-start"><div class="main"><div class="s"><b style="color:var(--ink)">+' + fmt(z.n) + '</b> · ' + new Date(z.t).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' ' + stBadge(z) + '</div>' + (z.note ? '<div class="s">' + esc(z.note) + '</div>' : '') + phImg(z.ph) + revBtns('m', e.id, g.id, z.id, z) + '</div></div>').join('') +
              '<button class="btn sm ' + (r.award ? 'sec' : '') + '" data-aw="' + g.id + '" data-emp="' + e.id + '" data-on="' + (r.award ? '0' : '1') + '" style="margin-top:6px">' + (r.award ? 'Bonusni bekor qilish' : '🎁 Bonus berish') + '</button></details>';
          }).join('') + '</div>';
      }).join('') : '<div class="card empty">' + esc(monName(month)) + ' uchun maqsad yo\'q</div>';
    }
    el.innerHTML = h;
    loadPhotos(el, true);
    if ($('#dt')) $('#dt').onchange = e => { date = e.target.value; load(); };
    if ($('#mn')) $('#mn').onchange = e => { month = e.target.value; load(); };
    if ($('#add')) $('#add').onclick = () => edit(tab === 'd' ? 'cl' : tab === 't' ? 'task' : 'goal', null);
    if ($('#copy')) $('#copy').onclick = e => busy(e.currentTarget, async () => {
      const d = new Date(month + '-01T00:00:00'); d.setMonth(d.getMonth() - 1);
      const from = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      await tadm('goal_copy', { from, month }); toast(monName(from) + ' maqsadlari nusxalandi', 'ok'); await load();
    });
    el.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { const k = b.dataset.ed; const l = k === 'cl' ? data.checklist : k === 'task' ? data.tasks : data.goals; edit(k, l.find(z => z.id === b.dataset.id)); });
    el.querySelectorAll('[data-rv]').forEach(b => b.onclick = async () => {
      let rc = '';
      if (b.dataset.rv === 'ret') {
        rc = await new Promise(res => { const m = sheet('<h3>Qaytarish sababi</h3><input id="rc" maxlength="300" placeholder="Masalan: rasm aniq emas, qayta bajaring"><div class="row" style="margin-top:10px"><button class="btn sec" data-a="0">Bekor</button><button class="btn" data-a="1">Qaytarish</button></div>'); m.querySelector('#rc').focus(); m.querySelectorAll('button').forEach(x => x.onclick = () => { const v = m.querySelector('#rc').value.trim(); m.remove(); res(x.dataset.a === '1' ? (v || 'Qayta bajaring') : null); }); });
        if (rc == null) return;
      }
      await busy(b, async () => { await tadm('review', { kind: b.dataset.k, emp: b.dataset.emp, id: b.dataset.id, entry: b.dataset.e, st: b.dataset.rv, rc, date, month }); await load(); });
    });
    el.querySelectorAll('[data-close]').forEach(b => b.onclick = () => busy(b, async () => { await tadm('task_close', { id: b.dataset.close, closed: b.dataset.c === '1' }); await load(); }));
    el.querySelectorAll('[data-aw]').forEach(b => b.onclick = async () => {
      const g = data.goals.find(z => z.id === b.dataset.aw), e = data.employees.find(z => z.id === b.dataset.emp), on = b.dataset.on === '1';
      if (on && !await confirmBox('<b>' + esc(e.name) + '</b> uchun «' + esc(g.title) + '» bo\'yicha bonus' + (g.bonus ? ' (<b>' + esc(g.bonus) + '</b>)' : '') + ' tasdiqlansinmi?', 'Tasdiqlash')) return;
      await busy(b, async () => { await tadm('award', { id: g.id, emp: e.id, on, month }); toast(on ? 'Bonus tasdiqlandi 🎁' : 'Bonus bekor qilindi', 'ok'); await load(); });
    });
  };

  // Tahrirlash oynasi (band / topshiriq / maqsad)
  const edit = (kind, x) => {
    x = x || {};
    const all = !x.who || x.who === 'all';
    const names = { cl: 'Ro\'yxat bandi', task: 'Topshiriq', goal: 'Oylik maqsad' };
    const m = sheet('<h3>' + (x.id ? '✏️ ' : '➕ ') + names[kind] + '</h3>' +
      '<label>Nomi</label><input id="et" maxlength="160" value="' + esc(x.title || '') + '" placeholder="' + (kind === 'goal' ? 'Masalan: Yangi mahsulotdan 50 dona sotish' : kind === 'task' ? 'Masalan: Ombordagi yashiklarni tartiblash' : 'Masalan: Vitrinani artish') + '">' +
      '<label>Tavsif <span class="muted">(ixtiyoriy)</span></label><input id="ed" maxlength="1000" value="' + esc(x.desc || '') + '">' +
      (kind === 'task' ? '<label>Muddat <span class="muted">(ixtiyoriy)</span></label><input id="edu" type="date" value="' + esc(x.due || data.today) + '">' : '') +
      (kind === 'goal' ? '<div class="row"><div><label>Maqsad (son)</label><input id="eg" type="number" min="1" step="any" value="' + esc(x.target || 1) + '"></div><div><label>Birlik</label><input id="eu" maxlength="30" value="' + esc(x.unit || '') + '" placeholder="dona, marta…"></div></div>' +
        '<label>Bonus</label><input id="eb" maxlength="120" value="' + esc(x.bonus || '') + '" placeholder="Masalan: 200 000 so\'m">' : '') +
      '<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;margin-top:12px"><input type="checkbox" id="ep" style="width:22px;height:22px"' + (x.photo ? ' checked' : '') + '> 📷 Rasm hisobot majburiy</label>' +
      (kind === 'cl' ? '<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px"><input type="checkbox" id="ea" style="width:22px;height:22px"' + (x.active !== false ? ' checked' : '') + '> Faol (har kuni ko\'rinadi)</label>' : '') +
      '<label>Kimga</label><label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px"><input type="radio" name="ew" value="all" style="width:20px;height:20px"' + (all ? ' checked' : '') + '> Hamma xodimlarga</label>' +
      '<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px"><input type="radio" name="ew" value="sel" style="width:20px;height:20px"' + (all ? '' : ' checked') + '> Tanlangan xodimlarga:</label>' +
      '<div id="ews" style="padding-left:28px">' + data.employees.map(e => '<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px"><input type="checkbox" value="' + e.id + '" style="width:20px;height:20px"' + (!all && x.who.includes(e.id) ? ' checked' : '') + '> ' + esc(e.name) + (e.active ? '' : ' <span class="muted">(yopilgan)</span>') + '</label>').join('') + '</div>' +
      '<div class="row" style="margin-top:14px">' + (x.id ? '<button class="btn sec" id="edel" style="color:var(--bad);border-color:var(--bad);flex:0 0 52px">🗑️</button>' : '') + '<button class="btn sec" id="ex">Bekor</button><button class="btn" id="es">Saqlash</button></div>');
    m.querySelector('#ex').onclick = () => m.remove();
    m.querySelectorAll('#ews input').forEach(c => c.onchange = () => { m.querySelector('input[name=ew][value=sel]').checked = true; });
    m.querySelector('#es').onclick = e => busy(e.currentTarget, async () => {
      const sel = m.querySelector('input[name=ew]:checked').value === 'sel' ? [...m.querySelectorAll('#ews input:checked')].map(c => c.value) : 'all';
      if (Array.isArray(sel) && !sel.length) throw new Error('Kamida bitta xodimni belgilang');
      const item = Object.assign({}, x, { title: m.querySelector('#et').value, desc: m.querySelector('#ed').value, photo: m.querySelector('#ep').checked, who: sel });
      if (kind === 'cl') item.active = m.querySelector('#ea').checked;
      if (kind === 'task') item.due = m.querySelector('#edu').value;
      if (kind === 'goal') { item.target = Number(m.querySelector('#eg').value); item.unit = m.querySelector('#eu').value; item.bonus = m.querySelector('#eb').value; }
      if (!item.title.trim()) throw new Error('Nomini kiriting');
      await tadm(kind === 'cl' ? 'cl_save' : kind === 'task' ? 'task_save' : 'goal_save', { item, month });
      m.remove(); toast('Saqlandi', 'ok'); await load();
    });
    if (m.querySelector('#edel')) m.querySelector('#edel').onclick = async () => {
      if (!await confirmBox('«' + esc(x.title) + '» o\'chirilsinmi?', 'O\'chirish')) return;
      await busy(null, async () => { await tadm('del', { kind, id: x.id, month }); m.remove(); toast('O\'chirildi', 'ok'); await load(); });
    };
    m.querySelector('#et').focus();
  };
  await load();
}

function ean13ok(v) { let s = 0; for (let i = 0; i < 12; i++) s += (+v[i]) * (i % 2 ? 3 : 1); return (10 - s % 10) % 10 === +v[12]; }
function ean8ok(v) { let s = 0; for (let i = 0; i < 7; i++) s += (+v[i]) * (i % 2 ? 1 : 3); return (10 - s % 10) % 10 === +v[7]; }

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
go(screenHome, false);
</script>
</body>
</html>
